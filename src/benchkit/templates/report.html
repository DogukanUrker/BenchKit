<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BenchKit Results</title>
  <script>
    // Applied before paint so the report never flashes the wrong theme.
    // Dogi Light is the default; an explicit choice is remembered.
    (() => {
      let stored = null;
      try { stored = localStorage.getItem("benchkit-theme"); } catch (error) { stored = null; }
      document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
    })();
  </script>
  <style>
    /* Dogi (https://github.com/DogukanUrker/DogiZed): flat black or white,
       colour only where it carries meaning. */
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #ffffff;
      --card: #ffffff;
      --ink: #0b0b0b;
      --muted: #6b7280;
      --line: rgba(11, 11, 11, .12);
      --raise: rgba(11, 11, 11, .04);
      --track: rgba(11, 11, 11, .09);
      --green: #059669;
      --green-soft: #10b981;
      --red: #dc2626;
      --blue: #2563eb;
      --amber: #d97706;
      --bar: #6b7280;
      --bar-light: rgba(11, 11, 11, .09);
      --shade-1: #dbeafe;
      --shade-2: #bfdbfe;
      --shade-3: #93c5fd;
      --shade-4: #60a5fa;
      --shade-5: #3b82f6;
      --shade-6: #2563eb;
      --shade-7: #1d4ed8;
      --series-1: #059669;
      --series-2: #2563eb;
      --series-3: #db2777;
      --series-4: #0891b2;
      --series-5: #d97706;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #000000;
      --card: #000000;
      --ink: #ffffff;
      --muted: #6b7280;
      --line: rgba(255, 255, 255, .14);
      --raise: rgba(255, 255, 255, .06);
      --track: rgba(255, 255, 255, .12);
      --green: #34d399;
      --green-soft: #6ee7b7;
      --red: #ef4444;
      --blue: #60a5fa;
      --amber: #facc15;
      --bar: #9aa1ad;
      --bar-light: rgba(255, 255, 255, .12);
      --shade-1: #14304f;
      --shade-2: #1b4470;
      --shade-3: #235891;
      --shade-4: #2c6cb2;
      --shade-5: #3f86d4;
      --shade-6: #4f95e8;
      --shade-7: #60a5fa;
      --series-1: #34d399;
      --series-2: #60a5fa;
      --series-3: #f472b6;
      --series-4: #22d3ee;
      --series-5: #facc15;
    }

    :root {
      --sans: "Avenir Next", Avenir, "Century Gothic", sans-serif;
      --mono: "SFMono-Regular", "Cascadia Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html { background: var(--page); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .page { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 54px 0 70px; }

    .report-head {
      display: flex;
      justify-content: space-between;
      gap: 32px;
      align-items: end;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-size: 42px; line-height: 1; letter-spacing: -.045em; }
    .meta { margin: 0; color: var(--muted); font: 11px/1.55 var(--mono); }
    .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
    .best { text-align: right; }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--raise);
      color: var(--ink);
      cursor: pointer;
      font: 700 9px/1 var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .theme-toggle:hover { border-color: var(--blue); color: var(--blue); }
    .theme-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
    .best-score { color: var(--green); font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: -.045em; }
    .best-model { margin-top: 6px; font-size: 12px; font-weight: 800; }

    .summary {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      margin: 28px 0 64px;
      background: var(--card);
      border: 1px solid var(--line);
    }
    .stat { padding: 21px 24px; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat-label { color: var(--muted); font: 9px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .stat-value { margin-top: 8px; font-size: 25px; font-weight: 800; letter-spacing: -.035em; }

    .section { margin-top: 64px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    h2 { margin: 0; font-size: 24px; letter-spacing: -.035em; }
    .section-note { margin: 0; color: var(--muted); font-size: 10px; }
    .charts { display: grid; gap: 30px; }

    .chart-shell {
      position: relative;
      width: 100%;
      min-width: 0;
      padding: 42px 52px 36px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
    }
    .chart-header { display: flex; align-items: baseline; gap: 8px; }
    .chart-title { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.035em; text-transform: none; }
    .chart-subtitle { color: var(--muted); font-size: 22px; font-weight: 700; }
    .bar-plot {
      display: flex;
      align-items: stretch;
      gap: clamp(18px, 4vw, 54px);
      height: 510px;
      margin-top: 32px;
      padding: 0 24px;
      border-bottom: 2px solid var(--line);
    }
    .bar-item {
      display: grid;
      grid-template-rows: 54px 1fr;
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
    }
    .bar-value {
      align-self: end;
      padding-bottom: 12px;
      color: var(--bar);
      font-size: clamp(24px, 3.4vw, 42px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.05em;
    }
    .bar-value small { font-size: .56em; letter-spacing: -.02em; }
    .bar-item.winner .bar-value { color: var(--green); }
    .bar-slot { display: flex; align-items: end; min-height: 0; }
    .bar {
      width: 100%;
      height: calc(var(--value) * 1%);
      min-height: 3px;
      border-radius: 11px 11px 0 0;
      background: var(--shade, var(--bar));
      transform-origin: bottom;
      animation: rise .55s cubic-bezier(.25,.7,.2,1) both;
    }
    .bar-item.winner .bar { background: linear-gradient(var(--green-soft), var(--green)); }
    @keyframes rise { from { transform: scaleY(0); } }

    .bar-labels {
      display: flex;
      gap: clamp(18px, 4vw, 54px);
      padding: 17px 24px 0;
    }
    .bar-label { flex: 1 1 0; min-width: 0; text-align: center; }
    .model-name {
      overflow: hidden;
      font-size: clamp(10px, 1.5vw, 14px);
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-meta { margin-top: 5px; color: var(--muted); font-size: clamp(8px, 1vw, 10px); font-weight: 700; }

    .suite-plot {
      display: flex;
      align-items: end;
      gap: 34px;
      height: 515px;
      margin-top: 32px;
      padding: 0 16px;
      border-bottom: 2px solid var(--line);
    }
    .suite-group { display: grid; grid-template-rows: 1fr 42px; flex: 1 1 0; min-width: 0; height: 100%; }
    .suite-bars { display: flex; align-items: end; justify-content: center; gap: 8px; min-height: 0; }
    .suite-bar { width: min(34px, 28%); height: calc(var(--value) * 1%); min-height: 3px; border-radius: 6px 6px 0 0; background: var(--shade); }
    .suite-name { align-self: center; overflow: hidden; font-size: 10px; font-weight: 800; text-align: center; text-overflow: ellipsis; text-transform: capitalize; white-space: nowrap; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 18px; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 9px; font-weight: 700; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--shade); }

    .scatter {
      display: block;
      width: 100%;
      height: 490px;
      margin-top: 18px;
      overflow: visible;
    }
    .grid-line { stroke: var(--line); stroke-width: 1; }
    .axis-label { fill: var(--muted); font: 9px var(--mono); }
    .scatter-dot { fill: var(--bar); stroke: var(--card); stroke-width: 3; }
    .scatter-dot.winner { fill: var(--green); }
    .scatter-label { fill: var(--ink); font: 800 10px var(--sans); }

    .stack-list { display: grid; gap: 24px; margin-top: 58px; }
    .stack-row { display: grid; grid-template-columns: 190px 1fr 70px; gap: 18px; align-items: center; }
    .stack-name { overflow: hidden; font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .stack-track { display: flex; height: 28px; overflow: hidden; border-radius: 7px; background: var(--track); }
    .stack-pass { width: calc(var(--value) * 1%); background: var(--green); }
    .stack-score { font-size: 17px; font-weight: 800; text-align: right; }
    .stack-key { display: flex; gap: 18px; margin-top: 26px; color: var(--muted); font-size: 9px; }
    .stack-key span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 2px; background: var(--green); vertical-align: -1px; }
    .stack-key span:last-child::before { background: var(--bar-light); }

    .horizontal-list { display: grid; gap: 20px; margin-top: 46px; }
    .horizontal-row { display: grid; grid-template-columns: 190px 1fr 88px; gap: 18px; align-items: center; }
    .horizontal-name { overflow: hidden; font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .horizontal-track { height: 18px; border-radius: 5px; background: var(--track); overflow: hidden; }
    .horizontal-fill { width: calc(var(--value) * 1%); height: 100%; border-radius: inherit; background: var(--bar); }
    .horizontal-row.winner .horizontal-fill { background: var(--green); }
    .horizontal-fill.loop-fill { background: var(--red); }
    .horizontal-row.clean .horizontal-value { color: var(--green); }
    .horizontal-value { color: var(--bar); font-size: 15px; font-weight: 800; text-align: right; }
    .horizontal-row.winner .horizontal-value { color: var(--green); }

    .matrix-card { display: flex; flex-direction: column; }
    .matrix-wrap { margin-top: 34px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 14px; border-bottom: 1px solid var(--line); font-size: 10px; text-align: right; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    th { color: var(--muted); background: var(--raise); font: 8px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    th:first-child, td:first-child { position: sticky; left: 0; text-align: left; }
    th:first-child { z-index: 2; background: var(--raise); }
    td:first-child { z-index: 1; max-width: 240px; background: var(--card); font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
    .score-cell { color: var(--green); font-size: 14px; font-weight: 800; }

    .details { display: grid; gap: 8px; }
    details { border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
    summary {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 18px;
      align-items: center;
      padding: 17px 19px;
      list-style: none;
      cursor: pointer;
      font-size: 10px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--muted); font: 15px/1 var(--mono); }
    details[open] summary::after { content: "−"; }
    .detail-title { font-weight: 800; overflow-wrap: anywhere; }
    .detail-score { color: var(--muted); }
    .tasks { padding: 0 10px 10px; }
    .task { padding: 15px 8px; border-top: 1px solid var(--line); }
    .task-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 10px; font: 9px/1 var(--mono); }
    .status { color: var(--red); font-weight: 900; }
    .status.pass { color: var(--green); }
    .status.partial { color: var(--amber); }
    .loop-status { margin-left: 10px; color: var(--muted); font-weight: 900; }
    .loop-status.looping { color: var(--red); }
    .loop-status.suspected { color: var(--amber); }
    .exchange { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .thinking-code { grid-column: 1 / -1; }
    .code { min-width: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--raise); overflow: hidden; }
    .code-label { padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font: 8px/1 var(--mono); text-transform: uppercase; }
    pre { max-height: 300px; margin: 0; padding: 11px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 9px/1.55 var(--mono); }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 70px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font: 8px/1.4 var(--mono); }

    @media (max-width: 720px) {
      .page { width: min(100% - 24px, 600px); padding-top: 34px; }
      .report-head { display: block; }
      .head-right { align-items: flex-start; margin-top: 24px; }
      .best { text-align: left; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .stat:nth-child(3) { border-top: 1px solid var(--line); border-left: 0; }
      .stat:nth-child(4) { border-top: 1px solid var(--line); }
      .stat:nth-child(5) { border-top: 1px solid var(--line); border-left: 0; }
      .chart-shell { padding: 25px 18px 24px; border-radius: 14px; }
      .chart-title { font-size: 18px; }
      .chart-subtitle { font-size: 17px; }
      .bar-plot { height: 380px; gap: 12px; padding: 0 4px; }
      .bar-labels { gap: 12px; padding: 14px 4px 0; }
      .stack-row, .horizontal-row { grid-template-columns: 110px 1fr 58px; gap: 10px; }
      .exchange { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="report-head">
      <div>
        <h1>BenchKit results</h1>
        <p class="meta" id="reportMeta"></p>
      </div>
      <div class="head-right">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
          <span class="theme-dot"></span><span id="themeLabel">Dark</span>
        </button>
        <div class="best" id="best"></div>
      </div>
    </header>

    <section class="summary" id="summary"></section>
    <section id="contamination"></section>

    <section class="section">
      <div class="section-head"><h2>Chart gallery</h2><p class="section-note">Inspect and capture any chart directly</p></div>
      <div class="charts">
        <div id="overallChart"></div>
        <div id="harnessChart"></div>
        <div id="repairChart"></div>
        <div id="robustnessChart"></div>
        <div id="loopChart"></div>
        <div id="benchmarkCharts" class="charts"></div>
        <div id="suiteChart"></div>
        <div id="efficiencyChart"></div>
        <div id="speedChart"></div>
        <div id="compositionChart"></div>
        <div id="runtimeChart"></div>
        <div id="matrix"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Task details</h2></div>
      <div class="details" id="details"></div>
    </section>

    <footer><span id="footerMeta"></span><span>Generated by BenchKit</span></footer>
  </main>

  <script id="reportData" type="application/json">__BENCHKIT_REPORT_DATA__</script>
  <script>
    const root = document.documentElement;
    const themeLabel = document.getElementById("themeLabel");
    const setTheme = mode => {
      root.dataset.theme = mode;
      themeLabel.textContent = mode === "dark" ? "Light" : "Dark";
    };
    setTheme(root.dataset.theme === "dark" ? "dark" : "light");
    document.getElementById("themeToggle").addEventListener("click", () => {
      const next = root.dataset.theme === "dark" ? "light" : "dark";
      setTheme(next);
      try { localStorage.setItem("benchkit-theme", next); } catch (error) { /* file:// */ }
    });

    const report = JSON.parse(document.getElementById("reportData").textContent);
    const rows = report.results.map(row => ({
      ...row,
      model: `${row.model} · ${row.harness_label || (row.harness === "pi" ? "Pi agent" : "Direct")}`,
    }));
    const capabilityRows = rows.filter(row => !row.perturbation);
    const harnessRows = rows.filter(row => row.harness_paired_total != null);
    const repairRows = rows.filter(row => Number(row.repair_attempts) > 0);
    const robustnessRows = rows.filter(row => row.perturbation && row.paired_total);
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const number = value => Number(value) || 0;
    const benchmarkLabel = row => row.benchmark_label || row.benchmark;
    const robustnessMeta = row => row.perturbation
      ? ` · ${number(row.score_delta_pp) >= 0 ? "+" : ""}${number(row.score_delta_pp).toFixed(1)}pp · ${number(row.regressions)}/${number(row.paired_total)} regressions`
      : "";
    const streamSpeed = row => number(row.tok_s_per_stream ?? row.tok_s);
    const effectiveConcurrency = row => row.concurrency_eff != null
      ? number(row.concurrency_eff)
      : number(row.total_time) > 0
        ? number(row.avg_response_time) * number(row.total) / number(row.total_time)
        : 0;
    const aggregateSpeed = row => {
      if (row.tok_s_aggregate != null) return number(row.tok_s_aggregate);
      const tasksWithUsage = (row.tasks || []).filter(task => task.output_tokens != null);
      if (tasksWithUsage.length && number(row.total_time) > 0) {
        return tasksWithUsage.reduce((sum, task) => sum + number(task.output_tokens), 0) / number(row.total_time);
      }
      return streamSpeed(row) * effectiveConcurrency(row);
    };
    const loopLabel = task => task.recovered_cycle
      ? "RECOVERED"
      : task.loop_state === "clear" && task.loop_source === "answer" && task.trace_status === "unavailable"
        ? "NO TRACE"
        : (task.loop_state || "unavailable").toUpperCase();
    const formatScore = value => value == null ? "—" : `${number(value).toFixed(1)}<small>%</small>`;
    const clamp = value => Math.max(0, Math.min(100, number(value)));
    const formatTime = value => {
      const seconds = Math.round(number(value));
      if (seconds >= 3600) return `${Math.floor(seconds / 3600)}h ${Math.floor(seconds % 3600 / 60)}m`;
      if (seconds >= 60) return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
      return `${seconds}s`;
    };
    const date = report.generated_at.replace("_", " · ").replaceAll("-", ".");
    const benchmarks = [...new Set(capabilityRows.map(benchmarkLabel))];
    const totalTasks = rows.reduce((sum, row) => sum + number(row.total), 0);
    const contaminatedTasks = rows.flatMap(row => row.contaminated_tasks || []);
    const contaminationByLanguage = rows.reduce((counts, row) => {
      Object.entries(row.contamination_by_language || {}).forEach(([language, count]) => {
        counts[language] = number(counts[language]) + number(count);
      });
      return counts;
    }, {});
    const totalScored = rows.reduce((sum, row) => sum + number(row.scored_total ?? row.total), 0);
    const totalLoops = rows.reduce((sum, row) => sum + number(row.loops), 0);
    const totalRuntime = rows.reduce((sum, row) => sum + number(row.total_time), 0);
    const environment = [report.provider, report.hardware].filter(Boolean).join(" · ") || "Local inference";

    const grouped = new Map();
    rows.forEach(row => {
      const item = grouped.get(row.model) || { model: row.model, passed: 0, total: 0, taskTotal: 0, loops: 0, outputTokens: 0, generationTime: 0, requestTime: 0, runtime: 0 };
      const knownOutputTokens = row.throughput_output_tokens != null
        ? number(row.throughput_output_tokens)
        : row.total_output_tokens != null
        ? number(row.total_output_tokens)
        : 0;
      const reportedRuntime = number(row.throughput_wall_time ?? row.total_time);
      const runtime = reportedRuntime > 0
        ? reportedRuntime
        : knownOutputTokens > 0 && aggregateSpeed(row) > 0
          ? knownOutputTokens / aggregateSpeed(row)
          : 0;
      const outputTokens = knownOutputTokens || aggregateSpeed(row) * runtime;
      if (row.include_in_overall !== false) {
        item.passed += number(row.passed);
        item.total += number(row.scored_total ?? row.total);
      }
      item.taskTotal += number(row.total);
      item.loops += number(row.loops);
      item.outputTokens += outputTokens;
      item.generationTime += row.sum_generation_time != null
        ? number(row.sum_generation_time)
        : streamSpeed(row) > 0 ? outputTokens / streamSpeed(row) : 0;
      item.requestTime += row.sum_request_time != null
        ? number(row.sum_request_time)
        : effectiveConcurrency(row) * runtime;
      item.runtime += runtime;
      grouped.set(row.model, item);
    });
    const models = [...grouped.values()].map(item => ({
      ...item,
      score: item.total ? item.passed / item.total * 100 : null,
      loopRate: item.taskTotal ? item.loops / item.taskTotal * 100 : 0,
      speed: item.runtime ? item.outputTokens / item.runtime : 0,
      streamSpeed: item.generationTime ? item.outputTokens / item.generationTime : 0,
      effective: item.runtime ? item.requestTime / item.runtime : 0,
    })).sort((a, b) => number(b.score) - number(a.score) || b.speed - a.speed);
    const scoredModels = models.filter(model => model.score != null);
    const best = scoredModels[0] || null;

    const chartItems = items => [...items].sort((a, b) => b.value - a.value).slice(0, 7).sort((a, b) => a.value - b.value);
    const shades = [1, 2, 3, 4, 5, 6, 7].map(step => `var(--shade-${step})`);
    const chart = ({ title, subtitle, items, scale = 100, suffix = "%", meta }) => {
      const visible = chartItems(items);
      const max = Math.max(
        1,
        scale === "max"
          ? Math.max(...visible.map(item => item.value))
          : number(scale)
      );
      const bestValue = Math.max(0, ...visible.map(item => number(item.value)));
      return `<article class="chart-shell">
        <div class="chart-header"><h3 class="chart-title">${escapeHtml(title)}</h3><span class="chart-subtitle">· ${escapeHtml(subtitle)}</span></div>
        <div class="bar-plot">${visible.map((item, index) => {
          const winner = number(item.value) === bestValue;
          const height = Math.max(0, Math.min(100, item.value / max * 100));
          const shown = suffix === "%" ? formatScore(item.value) : `${number(item.value).toFixed(1)}`;
          return `<div class="bar-item ${winner ? "winner" : ""}">
            <div class="bar-value">${shown}</div>
            <div class="bar-slot"><div class="bar" style="--value:${height};--shade:${shades[Math.min(index, shades.length - 1)]};animation-delay:${index * 45}ms"></div></div>
          </div>`;
        }).join("")}</div>
        <div class="bar-labels">${visible.map(item => `<div class="bar-label">
          <div class="model-name" title="${escapeHtml(item.model)}">${escapeHtml(item.model)}</div>
          <div class="model-meta">${escapeHtml(meta(item))}</div>
        </div>`).join("")}</div>
      </article>`;
    };

    const overallItems = scoredModels.map(model => ({ ...model, value: model.score }));
    const speedItems = models.map(model => ({ ...model, value: model.speed }));
    const benchmarkItems = benchmark => rows
      .filter(row => benchmarkLabel(row) === benchmark)
      .map(row => ({ model: row.model, value: number(row.score), passed: row.passed, scoredTotal: number(row.scored_total ?? row.total), speed: aggregateSpeed(row) }));

    const chartConfigs = new Map();
    chartConfigs.set("overall", {
      title: "Overall", subtitle: "accuracy", items: overallItems,
      meta: item => `${item.passed}/${number(item.scored_total ?? item.total)} scored`,
    });
    chartConfigs.set("speed", {
      title: "Aggregate throughput", subtitle: "output tok/s · wall clock", items: speedItems, scale: "max", suffix: "",
      meta: item => `${item.speed.toFixed(1)} tok/s · ${item.streamSpeed.toFixed(1)} stream · ${item.effective.toFixed(2)}x eff`,
    });
    benchmarks.forEach((benchmark, index) => chartConfigs.set(`benchmark-${index}`, {
      title: benchmark, subtitle: "accuracy", items: benchmarkItems(benchmark),
      meta: item => `${item.passed}/${item.scoredTotal} scored`,
    }));

    document.getElementById("reportMeta").textContent = [date, environment, report.host].filter(Boolean).join(" · ");
    document.getElementById("best").innerHTML = best
      ? `<div class="best-score">${formatScore(best.score)}</div><div class="best-model">${escapeHtml(best.model)} · best overall</div>`
      : `<div class="best-score">—</div><div class="best-model">Per-context scores · no RULER average</div>`;
    document.getElementById("summary").innerHTML = [
      ["Configurations", models.length],
      ["Benchmarks", benchmarks.length],
      ["Tasks scored", `${totalScored} / ${totalTasks} attempted`],
      ["Loops detected", `${totalLoops} · ${totalTasks ? (totalLoops / totalTasks * 100).toFixed(1) : "0.0"}%`],
      ["Peak throughput", `${Math.max(0, ...models.map(model => model.speed)).toFixed(1)} tok/s`],
      ["Runtime", formatTime(totalRuntime)],
    ].map(([label, value]) => `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`).join("");
    document.getElementById("contamination").innerHTML = contaminatedTasks.length
      ? `<article class="chart-shell"><div class="chart-header"><h3 class="chart-title">⚠️ Contamination detected</h3><span class="chart-subtitle">· excluded from headline score</span></div><p>${contaminatedTasks.length} task(s) · ${escapeHtml(Object.entries(contaminationByLanguage).sort().map(([language, count]) => `${language} ${count}`).join(" · "))}</p><p>${escapeHtml(contaminatedTasks.map(task => task.task_id).join(", "))}</p></article>`
      : "";
    document.getElementById("overallChart").innerHTML = scoredModels.length
      ? chart(chartConfigs.get("overall"))
      : `<article class="chart-shell"><div class="chart-header"><h3 class="chart-title">Overall</h3><span class="chart-subtitle">· not applicable</span></div><p class="section-note">RULER is reported independently at each context length.</p></article>`;
    document.getElementById("harnessChart").innerHTML = harnessRows.length
      ? `<article class="chart-shell matrix-card">
          <div class="chart-header"><h3 class="chart-title">Harness score comparison</h3><span class="chart-subtitle">· paired direct vs stock Pi</span></div>
          <div class="matrix-wrap"><table>
          <thead><tr><th>Model</th><th>Benchmark</th><th>Feedback</th><th>Paired</th><th>Direct first</th><th>Pi first</th><th>Initial score Δ</th><th>Direct final</th><th>Pi final</th><th>Final score Δ</th><th>Direct loop kill</th><th>Pi loop kill</th><th>Loop-kill Δ</th><th>Gains</th><th>Regressions</th><th>Pi version</th></tr></thead>
          <tbody>${harnessRows.map(row => `<tr>
            <td>${escapeHtml(row.model.replace(/ · Pi agent(?: \+ repair)?$/, ""))}</td>
            <td>${escapeHtml(benchmarkLabel(row))}</td>
            <td>${number(row.repair_attempts)} repair turn(s)</td>
            <td>${number(row.harness_paired_total)}</td>
            <td>${number(row.direct_first_score).toFixed(1)}%</td>
            <td>${number(row.harness_first_score).toFixed(1)}%</td>
            <td>${number(row.harness_first_score_delta_pp) >= 0 ? "+" : ""}${number(row.harness_first_score_delta_pp).toFixed(1)}pp</td>
            <td>${number(row.direct_score).toFixed(1)}%</td>
            <td>${number(row.harness_score).toFixed(1)}%</td>
            <td>${number(row.harness_score_delta_pp) >= 0 ? "+" : ""}${number(row.harness_score_delta_pp).toFixed(1)}pp</td>
            <td>${number(row.direct_loop_kill_rate).toFixed(1)}%</td>
            <td>${number(row.harness_loop_kill_rate).toFixed(1)}%</td>
            <td>${number(row.loop_kill_delta_pp) >= 0 ? "+" : ""}${number(row.loop_kill_delta_pp).toFixed(1)}pp</td>
            <td>${number(row.harness_gains)}</td>
            <td>${number(row.harness_regressions)}</td>
            <td>${escapeHtml(row.harness_version || "latest")}</td>
          </tr>`).join("")}</tbody>
          </table></div>
        </article>`
      : "";
    document.getElementById("repairChart").innerHTML = repairRows.length
      ? `<article class="chart-shell matrix-card">
          <div class="chart-header"><h3 class="chart-title">Verifier repair effect</h3><span class="chart-subtitle">· first answer vs final answer</span></div>
          <div class="matrix-wrap"><table>
          <thead><tr><th>Configuration</th><th>Benchmark</th><th>First</th><th>Final</th><th>Delta</th><th>Retried</th><th>Repaired</th></tr></thead>
          <tbody>${repairRows.map(row => `<tr>
            <td>${escapeHtml(row.model)}</td>
            <td>${escapeHtml(benchmarkLabel(row))}</td>
            <td>${number(row.first_attempt_score).toFixed(1)}%</td>
            <td>${number(row.score).toFixed(1)}%</td>
            <td>${number(row.repair_delta_pp) >= 0 ? "+" : ""}${number(row.repair_delta_pp).toFixed(1)}pp</td>
            <td>${number(row.repair_attempted)}</td>
            <td>${number(row.repair_successes)}</td>
          </tr>`).join("")}</tbody>
          </table></div>
        </article>`
      : "";
    document.getElementById("robustnessChart").innerHTML = robustnessRows.length
      ? `<article class="chart-shell matrix-card">
          <div class="chart-header"><h3 class="chart-title">Choice-order robustness</h3><span class="chart-subtitle">· paired clean comparison</span></div>
          <div class="matrix-wrap"><table>
          <thead><tr><th>Model</th><th>Benchmark</th><th>Clean</th><th>Perturbed</th><th>Delta</th><th>Regressions</th></tr></thead>
          <tbody>${robustnessRows.map(row => `<tr>
            <td>${escapeHtml(row.model)}</td>
            <td>${escapeHtml(row.baseline_benchmark_label || row.benchmark)}</td>
            <td>${number(row.baseline_score).toFixed(1)}%</td>
            <td>${number(row.perturbed_score).toFixed(1)}%</td>
            <td>${number(row.score_delta_pp) >= 0 ? "+" : ""}${number(row.score_delta_pp).toFixed(1)}pp</td>
            <td>${number(row.regressions)}/${number(row.paired_total)}</td>
          </tr>`).join("")}</tbody>
          </table></div>
        </article>`
      : "";
    const maxLoopRate = Math.max(1, ...models.map(model => model.loopRate));
    document.getElementById("loopChart").innerHTML = `<article class="chart-shell">
      <div class="chart-header"><h3 class="chart-title">Generation loops</h3><span class="chart-subtitle">· lower is better</span></div>
      <div class="horizontal-list">${[...models].sort((a, b) => a.loopRate - b.loopRate).slice(0, 7).map(model => `<div class="horizontal-row ${model.loopRate === 0 ? "clean" : ""}">
        <div class="horizontal-name" title="${escapeHtml(model.model)}">${escapeHtml(model.model)}</div>
        <div class="horizontal-track"><div class="horizontal-fill loop-fill" style="--value:${model.loopRate / maxLoopRate * 100}"></div></div>
        <div class="horizontal-value">${model.loopRate.toFixed(1)}%</div>
      </div>`).join("")}</div>
    </article>`;
    document.getElementById("benchmarkCharts").innerHTML = benchmarks.map((_, index) => chart(chartConfigs.get(`benchmark-${index}`))).join("");

    const visibleModels = models.slice(0, 5);
    const seriesShades = [1, 2, 3, 4, 5].map(step => `var(--series-${step})`);
    const rowLookupForBenchmark = benchmark => new Map(
      rows.filter(row => benchmarkLabel(row) === benchmark).map(row => [row.model, row])
    );
    document.getElementById("suiteChart").innerHTML = `<article class="chart-shell">
      <div class="chart-header"><h3 class="chart-title">Capability overview</h3><span class="chart-subtitle">· accuracy</span></div>
      <div class="suite-plot">${benchmarks.map(benchmark => {
        const lookup = rowLookupForBenchmark(benchmark);
        return `<div class="suite-group">
          <div class="suite-bars">${visibleModels.map((model, index) => {
            const row = lookup.get(model.model);
            return `<div class="suite-bar" style="--value:${clamp(row?.score)};--shade:${seriesShades[index]}" title="${escapeHtml(model.model)} · ${row ? number(row.score).toFixed(1) : "0.0"}%"></div>`;
          }).join("")}</div>
          <div class="suite-name">${escapeHtml(benchmark)}</div>
        </div>`;
      }).join("")}</div>
      <div class="legend">${visibleModels.map((model, index) => `<div class="legend-item"><span class="legend-swatch" style="--shade:${seriesShades[index]}"></span>${escapeHtml(model.model)}</div>`).join("")}</div>
    </article>`;

    const scatterSvg = () => {
      const width = 1000;
      const height = 480;
      const pad = { left: 62, right: 170, top: 22, bottom: 52 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const maxSpeed = Math.max(1, ...models.map(model => model.speed));
      const x = value => pad.left + Math.log10(number(value) + 1) / Math.log10(maxSpeed + 1) * plotWidth;
      const y = value => pad.top + (1 - clamp(value) / 100) * plotHeight;
      return `<svg class="scatter" viewBox="0 0 ${width} ${height}" role="img" aria-label="Accuracy versus aggregate throughput">
        ${[0, 25, 50, 75, 100].map(tick => `<line class="grid-line" x1="${pad.left}" x2="${pad.left + plotWidth}" y1="${y(tick)}" y2="${y(tick)}"></line><text class="axis-label" x="${pad.left - 10}" y="${y(tick) + 3}" text-anchor="end">${tick}%</text>`).join("")}
        <text class="axis-label" x="${pad.left + plotWidth / 2}" y="${height - 8}" text-anchor="middle">AGGREGATE OUTPUT TOKENS / SECOND →</text>
        ${scoredModels.slice(0, 8).map((model, index) => {
          const cx = x(model.speed);
          const cy = y(model.score);
          return `<circle class="scatter-dot ${index === 0 ? "winner" : ""}" cx="${cx}" cy="${cy}" r="9"></circle><text class="scatter-label" x="${cx + 14}" y="${cy + (index % 2 ? 18 : -12)}">${escapeHtml(model.model)} · ${model.speed.toFixed(1)}</text>`;
        }).join("")}
      </svg>`;
    };
    document.getElementById("efficiencyChart").innerHTML = `<article class="chart-shell">
      <div class="chart-header"><h3 class="chart-title">Accuracy × throughput</h3><span class="chart-subtitle">· aggregate tok/s · upper right wins</span></div>
      ${scatterSvg()}
    </article>`;
    document.getElementById("speedChart").innerHTML = chart(chartConfigs.get("speed"));

    document.getElementById("compositionChart").innerHTML = `<article class="chart-shell">
      <div class="chart-header"><h3 class="chart-title">Passed tasks</h3><span class="chart-subtitle">· full suite</span></div>
      <div class="stack-list">${scoredModels.slice(0, 7).map(model => `<div class="stack-row">
        <div class="stack-name" title="${escapeHtml(model.model)}">${escapeHtml(model.model)}</div>
        <div class="stack-track"><div class="stack-pass" style="--value:${clamp(model.score)}"></div></div>
        <div class="stack-score">${number(model.score).toFixed(1)}%</div>
      </div>`).join("")}</div>
      <div class="stack-key"><span>Passed</span><span>Failed</span></div>
    </article>`;

    const maxRuntime = Math.max(1, ...models.map(model => model.runtime));
    document.getElementById("runtimeChart").innerHTML = `<article class="chart-shell">
      <div class="chart-header"><h3 class="chart-title">Total runtime</h3><span class="chart-subtitle">· lower is better</span></div>
      <div class="horizontal-list">${[...models].sort((a, b) => a.runtime - b.runtime).slice(0, 7).map((model, index) => `<div class="horizontal-row ${index === 0 ? "winner" : ""}">
        <div class="horizontal-name" title="${escapeHtml(model.model)}">${escapeHtml(model.model)}</div>
        <div class="horizontal-track"><div class="horizontal-fill" style="--value:${model.runtime / maxRuntime * 100}"></div></div>
        <div class="horizontal-value">${formatTime(model.runtime)}</div>
      </div>`).join("")}</div>
    </article>`;

    const heat = value => `color-mix(in srgb, var(--green) ${(clamp(value) / 5).toFixed(2)}%, transparent)`;
    const rowLookup = new Map();
    rows.forEach(row => {
      if (!rowLookup.has(row.model)) rowLookup.set(row.model, new Map());
      rowLookup.get(row.model).set(benchmarkLabel(row), row);
    });
    document.getElementById("matrix").innerHTML = `<article class="chart-shell matrix-card">
      <div class="chart-header"><h3 class="chart-title">Score matrix</h3><span class="chart-subtitle">· full suite</span></div>
      <div class="matrix-wrap"><table>
      <thead><tr><th>Model</th><th>Overall</th>${benchmarks.map(item => `<th>${escapeHtml(item)}</th>`).join("")}<th>Loops</th><th>Agg tok/s</th><th>Stream</th><th>Eff.</th></tr></thead>
      <tbody>${models.slice(0, 8).map(model => `<tr>
        <td>${escapeHtml(model.model)}</td><td class="score-cell" style="background:${model.score == null ? "transparent" : heat(model.score)}">${model.score == null ? "—" : `${number(model.score).toFixed(1)}%`}</td>
        ${benchmarks.map(benchmark => {
          const row = rowLookup.get(model.model)?.get(benchmark);
          return row
            ? `<td style="background:${heat(row.score)}">${number(row.score).toFixed(1)}%</td>`
            : "<td>—</td>";
        }).join("")}<td>${model.loopRate.toFixed(1)}%</td><td>${model.speed.toFixed(1)}</td><td>${model.streamSpeed.toFixed(1)}</td><td>${model.effective.toFixed(2)}x</td>
      </tr>`).join("")}</tbody>
      </table></div>
    </article>`;

    document.getElementById("details").innerHTML = rows
      .sort((a, b) => number(b.score) - number(a.score))
      .map(row => `<details>
        <summary><span class="detail-title">${escapeHtml(row.model)}${row.harness_version ? ` ${escapeHtml(row.harness_version)}` : ""} / ${escapeHtml(benchmarkLabel(row))}</span><span class="detail-score">${row.passed}/${number(row.scored_total ?? row.total)} scored · ${number(row.total)} attempted · ${number(row.score).toFixed(1)}% · failures ${number(row.failures)}/${number(row.loop_kills)}/${number(row.timeouts)}/${number(row.length_exceeded)}/${number(row.harness_errors)} (fail/loop/timeout/length/harness)${row.harness_score_delta_pp == null ? "" : ` · harness score ${number(row.harness_score_delta_pp) >= 0 ? "+" : ""}${number(row.harness_score_delta_pp).toFixed(1)}pp · loop-kill ${number(row.loop_kill_delta_pp) >= 0 ? "+" : ""}${number(row.loop_kill_delta_pp).toFixed(1)}pp`}${number(row.repair_attempts) ? ` · repair ${number(row.repair_delta_pp) >= 0 ? "+" : ""}${number(row.repair_delta_pp).toFixed(1)}pp · ${number(row.repair_successes)}/${number(row.repair_attempted)} fixed` : ""}${robustnessMeta(row)} · ${aggregateSpeed(row).toFixed(1)} agg tok/s · ${streamSpeed(row).toFixed(1)} stream · ${effectiveConcurrency(row).toFixed(2)}x eff · ${number(row.throughput_coverage ?? 100).toFixed(1)}% coverage</span></summary>
        ${row.pi_system_prompt ? `<div class="code thinking-code"><div class="code-label">Pi scaffold · ${number(row.pi_system_prompt_tokens)} tokens · sha256 ${escapeHtml(row.pi_system_prompt_sha256 || "unavailable")} · tools available: ${escapeHtml((row.pi_tools_available || []).join(", ") || "none")}${row.pi_max_output_tokens ? ` · output limit ${number(row.pi_max_output_tokens)} via ${escapeHtml(row.pi_max_output_tokens_field || "unknown")}` : ""}</div><pre>${escapeHtml(row.pi_system_prompt)}</pre></div>` : ""}
        ${(row.task_statistics || []).length ? `<div class="code"><div class="code-label">RULER per-task 95% confidence intervals</div><pre>${escapeHtml(row.task_statistics.map(item => `${item.task} · n=${item.samples} · ${number(item.score).toFixed(1)}% · [${number(item.ci95_low).toFixed(1)}%, ${number(item.ci95_high).toFixed(1)}%]`).join("\n"))}</pre></div>` : ""}
        ${row.tool_schema_validity_rate == null ? "" : `<div class="code thinking-code"><div class="code-label">Agentic metrics</div><pre>schema valid ${number(row.tool_schema_validity_rate).toFixed(1)}% · avg turns to solve ${row.avg_turns_to_solve == null ? "—" : number(row.avg_turns_to_solve).toFixed(1)} · avg tokens to solve ${row.avg_tokens_to_solve == null ? "—" : number(row.avg_tokens_to_solve).toFixed(0)} · post-error recovery ${row.post_error_recovery_rate == null ? "—" : `${number(row.post_error_recovery_rate).toFixed(1)}%`} · redundant ${number(row.redundant_action_rate).toFixed(1)}% · destructive ${number(row.destructive_action_count)}</pre></div>`}
        <div class="tasks">${(row.tasks || []).map(task => `<article class="task">
          <div class="task-head"><span>${escapeHtml(task.task_id)} · ${number(task.response_time_s).toFixed(1)}s · ${number(task.output_tokens)} output · ${number(task.input_tokens)} input · ${number(task.model_turns || 1)} turns · ${number(task.tool_calls)} tools</span><span><span class="status ${task.passed ? "pass" : number(task.score) > 0 ? "partial" : ""}">${task.contaminated ? "CONTAMINATED" : task.loop_killed ? "LOOP KILLED" : task.timed_out ? "TIMEOUT" : task.length_exceeded ? "LENGTH EXCEEDED" : task.harness_error ? "HARNESS ERROR" : task.passed ? "PASS" : number(task.score) > 0 ? `PARTIAL ${number(task.score).toFixed(0)}%` : "FAIL"}</span><span class="loop-status ${escapeHtml(task.loop_state)}">${escapeHtml(loopLabel(task))}</span></span></div>
          <div class="exchange">
            ${task.error ? `<div class="code"><div class="code-label">Error</div><pre>${escapeHtml(task.error)}</pre></div>` : ""}
            ${(task.workspace?.checkpoints || []).length ? `<div class="code"><div class="code-label">Checkpoints · ${number(task.workspace.positive_points)}/${number(task.workspace.max_points)} positive · −${number(task.workspace.penalty_points)} penalty</div><pre>${escapeHtml(task.workspace.checkpoints.map(checkpoint => `${checkpoint.awarded >= 0 ? "+" : ""}${number(checkpoint.awarded)} / ${checkpoint.weight >= 0 ? "+" : ""}${number(checkpoint.weight)}  ${checkpoint.id}\n${checkpoint.evidence || ""}`).join("\n\n"))}</pre></div>` : ""}
            ${task.workspace?.test_output ? `<div class="code"><div class="code-label">Workspace verifier · exit ${number(task.workspace.test_exit_code)} · ${escapeHtml((task.workspace.test_command || []).join(" "))}</div><pre>${escapeHtml(task.workspace.test_output)}</pre></div>` : ""}
            ${task.workspace?.patch ? `<div class="code"><div class="code-label">Workspace patch${task.workspace.patch_truncated ? " · truncated" : ""}</div><pre>${escapeHtml(task.workspace.patch)}</pre></div>` : ""}
            ${task.perturbation ? `<div class="code"><div class="code-label">Choice order · seed ${number(task.perturbation.seed)}</div><pre>${escapeHtml(task.perturbation.choice_order.join(", "))}\nanswer ${escapeHtml(task.perturbation.original_answer)} → ${escapeHtml(task.perturbation.perturbed_answer)}</pre></div>` : ""}
            ${(task.attempts || []).length ? `<div class="code thinking-code"><div class="code-label">Verifier-feedback attempts</div><pre>${escapeHtml(task.attempts.map(attempt => `Attempt ${number(attempt.attempt)} · ${attempt.passed ? "pass" : "fail"} · ${number(attempt.score).toFixed(1)}%${attempt.feedback ? `\nfeedback: ${attempt.feedback}` : ""}\n\n${attempt.response || ""}`).join("\n\n────────────────────────────────\n\n"))}</pre></div>` : ""}
            ${(task.tool_trace || []).length ? `<div class="code thinking-code"><div class="code-label">Pi native tool trace</div><pre>${escapeHtml(task.tool_trace.map(call => `${call.name || "tool"} · attempt ${number(call.attempt || 1)} · ${call.is_error ? "error" : "ok"} · ${number(call.duration_s).toFixed(3)}s\n${JSON.stringify(call.arguments || {}, null, 2)}${call.output ? `\noutput${call.output_truncated ? " (last 8,000 chars)" : ""}:\n${call.output}` : ""}`).join("\n\n"))}</pre></div>` : ""}
            ${task.thinking ? `<div class="code thinking-code"><div class="code-label">Thinking · ${number(task.thinking_time_s).toFixed(1)}s · loop score ${(number(task.loop_score) * 100).toFixed(0)}%</div><pre>${escapeHtml(task.thinking)}</pre></div>` : ""}
            <div class="code"><div class="code-label">Prompt</div><pre>${escapeHtml(task.prompt)}</pre></div>
            <div class="code"><div class="code-label">Response</div><pre>${escapeHtml(task.response)}</pre></div>
          </div>
        </article>`).join("")}</div>
      </details>`).join("");
    document.getElementById("footerMeta").textContent = [date, environment].filter(Boolean).join(" · ");

  </script>
</body>
</html>
